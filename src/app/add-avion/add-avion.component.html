<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-body">

      <h2>Ajouter un Avion :</h2>

      <form>
        <div class="row">

          <div class="col-sm-2 col-md-2 col-lg-2 mb-3">
            <label>Id Avion</label>
            <input type="number"
                   [(ngModel)]="newAvion.idAvion"
                   name="idAvion"
                   class="form-control">
          </div>

          <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
            <label>Matricule</label>
            <input type="text"
                   [(ngModel)]="newAvion.matricule"
                   name="matricule"
                   class="form-control">
          </div>

          <div class="col-sm-6 col-md-6 col-lg-6 mb-3">
            <label>Modèle</label>
            <input type="text"
                   [(ngModel)]="newAvion.modele"
                   name="modele"
                   class="form-control">
          </div>

          <div class="col-sm-6 col-md-6 col-lg-6 mb-3">
            <label for="idCompagnie">Compagnie aérienne</label>
            <select class="form-select"
                    id="idCompagnie"
                    name="idCompagnie"
                    [(ngModel)]="newIdCompagnie">
              @for (compagnie of compagnies; track compagnie.idCompagnie) {
                <option [ngValue]="compagnie.idCompagnie">{{ compagnie.nomCompagnie }}</option>
              }
            </select>
          </div>

          <div class="col-sm-3 col-md-3 col-lg-3 mb-3">
            <label>Capacité</label>
            <input type="number"
                   [(ngModel)]="newAvion.capacite"
                   name="capacite"
                   class="form-control">
          </div>

          <div class="col-sm-3 col-md-3 col-lg-3 mb-3">
            <label>Date mise en service</label>
            <input type="date"
                   [ngModel]="newAvion.dateMiseEnService | date:'yyyy-MM-dd'"
                   (ngModelChange)="newAvion.dateMiseEnService = $event"
                   name="dateMiseEnService"
                   class="form-control">
          </div>

        </div>

        <div class="mt-2">
          <button type="button"
                  (click)="addAvion()"
                  class="btn btn-success">
            Ajouter
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
